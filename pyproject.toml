[project]
name = "msdf"
version = "0.0.0"
description = "Micro Service Data Flow — data-centric orchestration for microservices"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jaehwi Lee" }]
keywords = ["dataflow", "orchestration", "microservices", "dag", "lineage"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pydantic>=2.13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# start()로 엔진에 붙는 서비스
runtime = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
]
# msdf up (Scheduler + UI). runtime을 포함한다
server = [
    "msdf[runtime]",
]

[project.scripts]
msdf = "ms_dataflow.cli:main"

# Resolver 백엔드는 내장도 같은 메커니즘으로 등록한다
[project.entry-points."msdf.resolvers"]
file = "ms_dataflow.resolvers.file:FileResolver"
sqlite = "ms_dataflow.resolvers.sqlite:SqliteResolver"

[project.urls]
Homepage = "https://github.com/OWNER/msdf"
Documentation = "https://github.com/OWNER/msdf/tree/main/docs"
Issues = "https://github.com/OWNER/msdf/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ms_dataflow"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
