[project]
name = "msdf"
version = "0.3.0"
description = "Micro Service Data Flow — data-centric orchestration for microservices"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jaehwi Lee" }]
keywords = ["dataflow", "orchestration", "microservices", "dag", "lineage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pydantic>=2.13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# start()로 엔진에 붙는 서비스
runtime = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
]
# msdf up (Scheduler + UI). runtime을 포함한다
server = [
    "msdf[runtime]",
]
# DataFrame을 Parquet으로 저장
dataframe = [
    "pandas>=2.2",
    "pyarrow>=17",
]

[project.scripts]
msdf = "ms_dataflow.cli:main"

# Resolver 백엔드는 내장도 같은 메커니즘으로 등록한다
[project.entry-points."msdf.resolvers"]
file = "ms_dataflow.resolvers.file:FileResolver"
sqlite = "ms_dataflow.resolvers.sqlite:SqliteResolver"

[project.urls]
Homepage = "https://github.com/funpinbo/MSDF"
Documentation = "https://github.com/funpinbo/MSDF/tree/main/docs"
Issues = "https://github.com/funpinbo/MSDF/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ms_dataflow"]
# 웹 UI 빌드 결과는 저장소에 없다. 패키지를 만들기 전에 frontend에서 npm run build를 했다면 함께 넣는다.
artifacts = ["ms_dataflow/ui/dist/**"]

[tool.hatch.build.targets.sdist]
exclude = ["frontend/node_modules", "design"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["design"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["^examples/", "^tests/fixtures/"]

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "pyarrow", "pyarrow.*", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
