<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSDF 엔진</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #dddcd6;
  --accent: #2f6fed; --ok: #2e7d4f; --run: #c08a12; --fail: #c4372f; --cancel: #8a8a85;
  --queued: #6b6b66; --node: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #9b9a93; --line: #34332f;
    --accent: #6b9bff; --ok: #5cbf86; --run: #e3b341; --fail: #ef6a5f; --cancel: #8a8a85;
    --queued: #9b9a93; --node: #262624;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", sans-serif; }
header { display: flex; gap: 16px; align-items: baseline; padding: 12px 16px;
  border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 16px; margin: 0; }
header .meta { color: var(--muted); font-size: 13px; }
main { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 49px); }
aside { border-right: 1px solid var(--line); padding: 12px; overflow: auto; background: var(--panel); }
section { padding: 16px; overflow: auto; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
h2:first-child { margin-top: 0; }
.item { display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent;
  color: inherit; padding: 6px 8px; border-radius: 6px; cursor: pointer; font: inherit; }
.item:hover { background: var(--bg); }
.item.sel { border-color: var(--accent); }
.item small { color: var(--muted); display: block; font-size: 12px; }
.badge { display: inline-block; padding: 0 6px; border-radius: 999px; font-size: 12px;
  border: 1px solid currentColor; }
.s-done { color: var(--ok); } .s-running, .s-leased, .s-saved { color: var(--run); }
.s-failed { color: var(--fail); } .s-cancelled { color: var(--cancel); } .s-queued { color: var(--queued); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 16px; }
.graph-wrap { overflow-x: auto; }
svg { width: 100%; height: auto; display: block; }
svg text { fill: var(--text); font-size: 12px; }
svg .slot { fill: var(--muted); font-size: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; }
pre { white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; font-size: 12px;
  background: var(--bg); padding: 8px; border-radius: 6px; max-height: 240px; overflow: auto; }
.muted { color: var(--muted); }
.empty { color: var(--muted); padding: 24px; text-align: center; }
.bar { height: 8px; background: var(--accent); border-radius: 4px; min-width: 2px; }
@media (max-width: 760px) {
  main { grid-template-columns: 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 40vh; }
  .hide-sm { display: none; }
  .graph-wrap svg { width: auto; min-width: 100%; }
}
</style>
</head>
<body>
<header>
  <h1>MSDF 엔진</h1>
  <span class="meta" id="meta">불러오는 중…</span>
</header>
<main>
  <aside>
    <h2>DAG</h2><div id="dags"></div>
    <h2>서비스</h2><div id="services"></div>
    <h2>최근 실행</h2><div id="runs"></div>
  </aside>
  <section>
    <div class="card"><div id="graph" class="empty">왼쪽에서 DAG나 실행을 고르세요.</div></div>
    <div id="detail"></div>
  </section>
</main>
<script>
const state = { dags: [], runs: [], services: [], dag: null, run: null, runData: null };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const time = (t) => t ? new Date(t * 1000).toLocaleTimeString() : "";
const STATUS = { queued: "대기", leased: "배정", running: "실행 중", saved: "저장됨", done: "완료", failed: "실패", cancelled: "취소" };

async function get(path) { const r = await fetch(path); if (!r.ok) throw new Error(r.status); return r.json(); }

async function refresh() {
  try {
    [state.dags, state.runs, state.services] = await Promise.all([
      get("/api/dags"), get("/api/runs?limit=30"), get("/api/services").then((x) => x.services)]);
    if (state.run) state.runData = await get(`/api/runs/${state.run}`);
    const live = state.services.filter((s) => s.instances.length).length;
    $("meta").textContent = `DAG ${state.dags.length}개 · 서비스 ${live}/${state.services.length}개 연결됨`;
    render();
  } catch (e) { $("meta").textContent = "엔진에 연결할 수 없습니다"; }
}

function render() {
  $("dags").innerHTML = state.dags.map((d) =>
    `<button class="item ${state.dag === d.order && !state.run ? "sel" : ""}" data-dag="${esc(d.order)}">${esc(d.order)}<small>노드 ${d.nodes.length}개</small></button>`).join("") || `<div class="muted">없음</div>`;
  $("services").innerHTML = state.services.map((s) =>
    `<div class="item">${esc(s.name)} <span class="badge ${s.instances.length ? "s-done" : "s-cancelled"}">${s.instances.length ? `인스턴스 ${s.instances.length}` : "꺼짐"}</span>
     <small>${s.orders.length ? "order: " + s.orders.map(esc).join(", ") : esc(s.actions.join(", "))}</small></div>`).join("") || `<div class="muted">등록된 서비스 없음</div>`;
  $("runs").innerHTML = state.runs.map((r) =>
    `<button class="item ${state.run === r.run_id ? "sel" : ""}" data-run="${esc(r.run_id)}">${esc(r.order_name)} <span class="badge s-${r.status === "running" ? "running" : r.status}">${esc(r.status)}</span>
     <small>${esc(r.requester)} · ${time(r.created_at)}${r.replans ? ` · 재계획 ${r.replans}` : ""}</small></button>`).join("") || `<div class="muted">아직 없음</div>`;
  const dagName = state.run && state.runData ? state.runData.run.order_name : state.dag;
  const dag = state.dags.find((d) => d.order === dagName);
  $("graph").innerHTML = dag ? graph(dag, state.run ? state.runData : null) : `<div class="empty">왼쪽에서 DAG나 실행을 고르세요.</div>`;
  $("graph").className = dag ? "" : "empty";
  $("detail").innerHTML = state.run && state.runData ? runDetail(state.runData) : dag ? dagDetail(dag) : "";
}

function layers(dag) {
  const parents = {};
  dag.nodes.forEach((n) => (parents[n.name] = []));
  dag.edges.forEach((e) => parents[e.to].push(e.from));
  const depth = {};
  const d = (n, seen = new Set()) => {
    if (depth[n] !== undefined) return depth[n];
    if (seen.has(n)) return 0;
    seen.add(n);
    depth[n] = parents[n].length ? 1 + Math.max(...parents[n].map((p) => d(p, seen))) : 0;
    return depth[n];
  };
  dag.nodes.forEach((n) => d(n.name));
  return depth;
}

function graph(dag, runData) {
  const depth = layers(dag);
  const cols = {};
  dag.nodes.forEach((n) => (cols[depth[n.name]] ??= []).push(n));
  const W = 180, H = 58, GX = 70, GY = 26, P = 16;
  const pos = {};
  Object.entries(cols).forEach(([c, ns]) => ns.forEach((n, i) => (pos[n.name] = { x: P + c * (W + GX), y: P + i * (H + GY) })));
  const deliverX = P + (Object.keys(cols).length) * (W + GX);
  const maxRows = Math.max(...Object.values(cols).map((c) => c.length), 1);
  const width = deliverX + W + P, height = P * 2 + maxRows * (H + GY);
  const status = {};
  if (runData) runData.steps.forEach((s) => { if (s.node) status[s.node] = s.status; });
  const cached = runData ? new Set(dag.nodes.map((n) => n.name).filter((n) => !status[n])) : new Set();
  const res = pos[dag.result.node];
  const deliver = runData ? runData.steps.filter((s) => s.kind !== "produce").at(-1) : null;
  const color = (st) => st ? `var(--${{ done: "ok", failed: "fail", cancelled: "cancel", queued: "queued" }[st] || "run"})` : "var(--line)";
  let svg = `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="DAG ${esc(dag.order)}"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--muted)"/></marker></defs>`;
  dag.edges.forEach((e) => {
    const a = pos[e.from], b = pos[e.to];
    const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2, mx = (x1 + x2) / 2;
    svg += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2 - 2},${y2}" fill="none" stroke="var(--muted)" marker-end="url(#arr)"/>`;
    svg += `<text class="slot" x="${mx}" y="${(y1 + y2) / 2 - 4}" text-anchor="middle">${esc(e.from_slot)}→${esc(e.to_slot)}</text>`;
  });
  dag.nodes.forEach((n) => {
    const p = pos[n.name], st = status[n.name];
    const stroke = st ? color(st) : cached.has(n.name) ? "var(--ok)" : "var(--line)";
    svg += `<g><rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="8" fill="var(--node)" stroke="${stroke}" stroke-width="${st || cached.has(n.name) ? 2 : 1}" ${cached.has(n.name) ? 'stroke-dasharray="5 4"' : ""}/>`;
    svg += `<text x="${p.x + 10}" y="${p.y + 22}" font-weight="600">${esc(n.name)}</text>`;
    svg += `<text class="slot" x="${p.x + 10}" y="${p.y + 40}">${esc(n.service)}.${esc(n.action)}${n.live ? "" : " · 꺼짐"}</text>`;
    if (st || cached.has(n.name)) svg += `<text class="slot" x="${p.x + W - 10}" y="${p.y + 22}" text-anchor="end">${st ? STATUS[st] : "캐시"}</text>`;
    svg += `</g>`;
  });
  const dy = res.y + H / 2;
  svg += `<path d="M${res.x + W},${dy} L${deliverX - 2},${dy}" stroke="var(--muted)" stroke-dasharray="3 3" marker-end="url(#arr)"/>`;
  const dl = dag.deliveries.map((d) => d.requester).join(", ");
  svg += `<rect x="${deliverX}" y="${res.y}" width="${W}" height="${H}" rx="8" fill="none" stroke="${deliver ? color(deliver.status) : "var(--line)"}" stroke-dasharray="4 3"/>`;
  svg += `<text x="${deliverX + 10}" y="${res.y + 22}" font-weight="600">배달 → ${esc(dl)}</text>`;
  svg += `<text class="slot" x="${deliverX + 10}" y="${res.y + 40}">${deliver ? esc(deliver.kind === "deliver" ? "on_success" : "on_fail") + " · " + STATUS[deliver.status] : "result: " + esc(dag.result.slot)}</text>`;
  return `<div class="graph-wrap">${svg.replace("<svg ", `<svg width="${width}" `)}</svg></div>`;
}

function dagDetail(dag) {
  return `<div class="card"><h2>${esc(dag.order)}</h2><div class="muted">${esc(dag.source || "")}</div>
  <table><tr><th>노드</th><th>Action</th><th>입력</th><th>출력</th></tr>
  ${dag.nodes.map((n) => `<tr><td>${esc(n.name)}</td><td>${esc(n.service)}.${esc(n.action)}</td><td>${esc(n.inputs.join(", "))}</td><td>${esc(n.outputs.join(", "))}</td></tr>`).join("")}
  </table><h2>배달</h2><table><tr><th>요청 서비스</th><th>on_success</th><th>on_fail</th></tr>
  ${dag.deliveries.map((d) => `<tr><td>${esc(d.requester)}</td><td>${esc(d.on_success)}</td><td>${esc(d.on_fail)}</td></tr>`).join("")}</table></div>`;
}

function runDetail({ run, steps }) {
  const t0 = Math.min(...steps.map((s) => s.queued_at || run.created_at));
  const t1 = Math.max(...steps.map((s) => s.done_at || s.started_at || s.queued_at || t0), t0 + 0.001);
  const span = t1 - t0;
  const failed = steps.find((s) => s.status === "failed");
  return `<div class="card"><h2>실행 ${esc(run.run_id)}</h2>
  <div>${esc(run.order_name)} · 요청 ${esc(run.requester)} · <span class="badge s-${run.status === "running" ? "running" : run.status}">${esc(run.status)}</span>
  <span class="muted"> · params ${esc(JSON.stringify(run.params))}${Object.keys(run.context).length ? " · context " + esc(JSON.stringify(run.context)) : ""}</span></div>
  ${failed ? `<h2>실패 위치</h2><div><b>${esc(failed.service)}.${esc(failed.action)}</b> (단계 ${failed.step_no}, 시도 ${failed.attempts}회)</div><pre>${esc(failed.error)}</pre>` : ""}
  </div><div class="card"><h2>단계</h2><table><tr><th>#</th><th class="hide-sm">종류</th><th>Action</th><th>상태</th><th class="hide-sm">시도</th><th class="hide-sm">타임라인</th></tr>
  ${steps.map((s) => {
    const a = s.started_at || s.queued_at || t0, b = s.done_at || a;
    const bar = `<div style="margin-left:${((a - t0) / span) * 100}%;width:${Math.max(((b - a) / span) * 100, 0.5)}%" class="bar"></div>`;
    return `<tr><td>${s.step_no}</td><td class="hide-sm">${esc({ produce: "생산", deliver: "배달", deliver_fail: "실패 통지" }[s.kind])}</td>
    <td>${esc(s.service)}.${esc(s.action)}${s.node ? ` <span class="muted">(${esc(s.node)})</span>` : ""}</td>
    <td><span class="badge s-${s.status}">${STATUS[s.status] || esc(s.status)}</span>${s.error && s.status !== "failed" ? `<div class="muted">${esc(s.error.split("\n").filter(Boolean).at(-1))}</div>` : ""}</td>
    <td class="hide-sm">${s.attempts}/${s.max_retries + 1}</td><td class="hide-sm" style="min-width:140px">${bar}</td></tr>`;
  }).join("")}</table></div>`;
}

document.addEventListener("click", async (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.dag) { state.dag = b.dataset.dag; state.run = null; state.runData = null; render(); }
  if (b.dataset.run) { state.run = b.dataset.run; state.runData = await get(`/api/runs/${state.run}`); render(); }
});
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
